<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Powershot – Menschen aus MakeHuman ansehen</title>
  <base href="../../">      <!-- alle Dateien werden vom Spiel-Ordner aus gesucht (die Seite selbst liegt in tools/mensch/) -->
  <!--
    Zum Ansehen der Spieler-Figuren (assets/mensch_a.glb … aus MakeHuman, gebaut mit tools/mensch/mensch.py).
    Starten:  python tools/server.py   und dann   http://localhost:8765/tools/mensch/schau.html
    In der Adresse:  ?m=b (welche Figur)  &altefiguren (die alten Modelle zum Vergleich)  &links (Linkshänder)
    Knöpfe: Figur wechseln, Bewegung wechseln, Blick wechseln. Mit der Maus ziehen = um die Figur drehen, Rad = näher.
  -->
  <style>
    body { margin: 0; background: #20304f; color: #fff; font: 16px system-ui, sans-serif; overflow: hidden; }
    #leiste { position: fixed; left: 12px; top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    button { font: inherit; color: #fff; background: #2a3a5a; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="bild"></canvas>
  <div id="leiste">
    <button id="figur"></button><button id="tun"></button><button id="blick"></button>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { loadFigure, MODELS } from './js/figur.js';
    import { loadGang } from './js/mocap.js';
    import { Avatar } from './js/avatar.js';

    const wunsch = new URLSearchParams(location.search);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bild'), antialias: true });
    renderer.shadowMap.enabled = true;
    const szene = new THREE.Scene();
    szene.background = new THREE.Color(0x20304f);
    szene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.6));
    const licht = new THREE.DirectionalLight(0xfff4d8, 2.4); licht.position.set(2, 5, -3); licht.castShadow = true;
    licht.shadow.mapSize.set(1024, 1024); Object.assign(licht.shadow.camera, { left: -2, right: 2, top: 3, bottom: -1 }); szene.add(licht);
    const boden = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: 0x3d6ea8, roughness: 0.9 }));
    boden.rotation.x = -Math.PI / 2; boden.receiveShadow = true; szene.add(boden);
    const kamera = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
    // Blicke: [Name, wo die Kamera steht, wohin sie schaut]
    const BLICKE = [['von vorn', [0, 1.2, -5.2], [0, 0.95, 0]], ['schräg von vorn', [3, 1.4, -4], [0, 0.95, 0]], ['von der Seite', [5.2, 1.1, 0], [0, 0.95, 0]],
      ['von hinten', [0, 1.5, 5.2], [0, 0.95, 0]], ['Gesicht', [0.25, 1.68, -1.2], [0, 1.62, 0]], ['Schlaghand', [1.4, 1.0, -1.3], [0.3, 0.85, -0.1]], ['Oberkörper', [0.6, 1.4, -2.2], [0, 1.25, 0]]];
    let blick = +(wunsch.get('blick') || 0);
    function schau(von, nach) { kamera.position.set(...von); kamera.lookAt(...nach); ziel.set(...nach); }
    const ziel = new THREE.Vector3();
    const blickStellen = () => { schau(BLICKE[blick][1], BLICKE[blick][2]); document.getElementById('blick').textContent = 'Blick: ' + BLICKE[blick][0]; };
    document.getElementById('blick').onclick = () => { blick = (blick + 1) % BLICKE.length; blickStellen(); };
    const passen = () => { renderer.setSize(innerWidth, innerHeight, false); kamera.aspect = innerWidth / innerHeight; kamera.updateProjectionMatrix(); };
    addEventListener('resize', passen); passen(); blickStellen();
    // Mit der Maus (oder dem Finger) um die Figur drehen, mit dem Rad näher heran
    let zieh = null;
    addEventListener('pointerdown', (e) => { if (e.target.tagName !== 'BUTTON') zieh = [e.clientX, e.clientY]; });
    addEventListener('pointerup', () => { zieh = null; });
    addEventListener('pointermove', (e) => {
      if (!zieh) return;
      const d = kamera.position.clone().sub(ziel), r = d.length();
      const w = Math.atan2(d.x, d.z) - (e.clientX - zieh[0]) * 0.01, h = Math.max(-1.2, Math.min(1.4, Math.asin(d.y / r) + (e.clientY - zieh[1]) * 0.006));
      kamera.position.set(ziel.x + r * Math.sin(w) * Math.cos(h), ziel.y + r * Math.sin(h), ziel.z + r * Math.cos(w) * Math.cos(h)); kamera.lookAt(ziel);
      zieh = [e.clientX, e.clientY];
    });
    addEventListener('wheel', (e) => { const d = kamera.position.clone().sub(ziel).multiplyScalar(e.deltaY > 0 ? 1.1 : 0.9); kamera.position.copy(ziel).add(d); });

    await Promise.all([loadFigure(), loadGang()]);
    // Sechs Spieler mit verschiedenen Farben – je einer pro Modell
    const LOOKS = {
      a: { shirt: 0x2f7fd0, shorts: 0xffffff, hair: 0x2b1d14, skin: 0xe2b48c },
      b: { shirt: 0xffffff, shorts: 0x1c2a4a, hair: 0xc9a25a, skin: 0xe8c2a0, pattern: 1, trim: 0xd03a3a, head: 'band' },
      c: { shirt: 0xe04a2a, shorts: 0x222222, hair: 0x1a1210, skin: 0x8a5a3c },
      d: { shirt: 0x1f9a6a, shorts: 0xffffff, hair: 0x241a14, skin: 0xb07a52, pattern: 2, trim: 0xffffff },
      e: { shirt: 0xf2d13a, shorts: 0x2a4a8a, hair: 0xb5472a, skin: 0xf0cdb0, head: 'cap' },
      f: { shirt: 0x7a3ad0, shorts: 0xffffff, hair: 0x3a2a1c, skin: 0xd9a77c, pattern: 4, trim: 0xffffff },
    };
    let m = wunsch.get('m') || 'a', av = null;
    function figurBauen() {
      if (av) { szene.remove(av.group); av.dispose(); }
      av = new Avatar({ ...LOOKS[m], model: m, shoes: 0xffffff }, 0, wunsch.has('links') ? -1 : 1, true);
      szene.add(av.group); window.__schau.av = av;
      document.getElementById('figur').textContent = 'Figur: ' + m;
    }
    document.getElementById('figur').onclick = () => { m = MODELS[(MODELS.indexOf(m) + 1) % MODELS.length]; figurBauen(); };
    // Was die Figur tut
    const TUN = ['stehen', 'gehen', 'laufen', 'bereit', 'Vorhand', 'Rückhand', 'Aufschlag', 'jubeln'];
    let tun = wunsch.get('tun') || 'stehen', uhr = 0;
    document.getElementById('tun').onclick = () => { tun = TUN[(TUN.indexOf(tun) + 1) % TUN.length]; uhr = 0; };
    function schritt(dt) {
      document.getElementById('tun').textContent = 'Bewegung: ' + tun;
      uhr += dt;
      const st = { x: 0, z: 0, vx: 0, vz: 0 };
      if (tun === 'stehen') Object.assign(st, { walk: true });
      else if (tun === 'gehen') Object.assign(st, { walk: true, vz: -1.4 });
      else if (tun === 'laufen') Object.assign(st, { walk: true, vz: -4, jog: 1 });
      else if (tun === 'Vorhand' || tun === 'Rückhand') {
        const k = tun === 'Vorhand' ? 'fh' : 'bh', t = uhr % 2.4;       // alle 2,4 Sekunden ein Schlag
        Object.assign(st, { prep: Math.min(1, t / 0.6), stroke: k });
        if (t < dt * 1.5 && uhr > 0.1) av.swing(k);
      } else if (tun === 'Aufschlag') Object.assign(st, { serveK: (uhr % 3) / 1.6 });
      else if (tun === 'jubeln') Object.assign(st, { mood: 'cheer' });
      av.update(dt, st);
      renderer.render(szene, kamera);
    }
    let zuletzt = performance.now(), angehalten = false;
    function bild(jetzt) { if (!angehalten) schritt(Math.min(0.05, (jetzt - zuletzt) / 1000)); zuletzt = jetzt; requestAnimationFrame(bild); }
    // Für Tests: __schau.halt(), __schau.step(n), __schau.tu('Vorhand'), __schau.figur('b'), __schau.schau([x,y,z],[x,y,z])
    window.__schau = { halt: () => { angehalten = true; }, step: (n = 1) => { for (let i = 0; i < n; i++) schritt(1 / 60); }, tu: (t) => { tun = t; uhr = 0; },
      figur: (k) => { m = k; figurBauen(); }, schau: (v, n) => { schau(v, n); }, male: () => renderer.render(szene, kamera) };
    figurBauen();
    requestAnimationFrame(bild);
  </script>
</body>
</html>
