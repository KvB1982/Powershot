<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-title" content="Powershot">
  <!-- Damit das Spiel wie eine App auf den Home-Bildschirm gelegt werden kann (Teilen → Zum Home-Bildschirm) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>Powershot Tennis</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="touch"></div>
  <div id="stick"><div></div></div>

  <div id="hud" hidden>
    <div id="scoreboard"></div>
    <button id="pauseBtn" aria-label="Pause">II</button>
    <button id="helpBtn" aria-label="Steuerung ansehen">?</button>
    <div id="speed"></div>
    <div id="msg"><div id="msgHead"></div><div id="msgSub"></div></div>
    <div id="toast"></div>
    <div id="power"><div id="powerFill"></div><div id="powerLimit"></div></div>
    <div id="aufschlagWahl"></div>
    <div id="trainBox"></div>
    <div id="zugBox"></div>
    <div id="hint"></div>
    <!-- Wiedergabe einer Aufnahme (Match-Rekorder): was gerade passiert ist, dazu Knöpfe (app.js füllt den Kasten) -->
    <div id="wgBox"></div>
    <canvas id="kameraMini" width="160" height="120"></canvas>
  </div>

  <!-- Einlaufszene vor dem Match: Titel oben, Steckbrief rechts (app.js füllt beides) -->
  <div id="einlauf" hidden>
    <div id="einlaufTitel"></div>
    <div id="einlaufKarte"></div>
    <button id="einlaufSkip">Überspringen ⏭</button>
    <div id="einlaufTipp">Tippen = weiter</div>
  </div>

  <div id="screen"></div>
  <div id="loading">Powershot wird geladen …</div>
  <div id="drehen"><div>📱↻</div>Bitte das Handy quer halten</div>

  <script type="module" src="js/app.js"></script>
  <script>
    // Den Helfer für "Spielen ohne Internet" anmelden (siehe sw.js).
    // Beim Entwickeln am eigenen Rechner (localhost) lassen wir ihn weg, damit man immer die neuesten
    // Dateien sieht. Zum Ausprobieren dort: http://localhost:8765/?offline
    const lokal = ['localhost', '127.0.0.1'].includes(location.hostname);
    if ('serviceWorker' in navigator && (!lokal || location.search.includes('offline'))) {
      navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Ohne Internet geht es nicht:', e));
      // Sobald alles geladen ist: dem Helfer sagen, welche Dateien die Seite schon geholt hat.
      const melden = async () => {
        const reg = await navigator.serviceWorker.ready;
        const liste = [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)];
        reg.active.postMessage({ merken: liste });
      };
      if (document.readyState === 'complete') melden(); else window.addEventListener('load', melden);
    }
  </script>
</body>
</html>
